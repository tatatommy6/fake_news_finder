<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가짜 뉴스 탐지기</title>
</head>
<body>
    <h1>📰 가짜 뉴스 탐지기</h1>
    
    <label for="keyword">검색할 키워드 입력:</label>
    <input type="text" id="keyword" required>
    <button onclick="startCrawling()">크롤링 시작</button>

    <div id="result"></div>
        <script>
        function startCrawling() {
            const keyword = document.getElementById('keyword').value;
            
            fetch('/crawl', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ keyword: keyword })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerText = `크롤링 결과: ${data.message}`;
            })
            .catch(error => {
                document.getElementById('result').innerText = '오류가 발생했습니다.';
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
