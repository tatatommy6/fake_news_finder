<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>뉴스 검색</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">뉴스 검색</h1>

                <div class="input-group mb-3">
                    <input type="text" id="keyword" class="form-control" placeholder="검색어 입력">
                    <button class="btn btn-primary" onclick="searchNews()">검색</button>
                </div>

                <ul id="results" class="list-group mb-3"></ul>

                <!-- 예측하기 버튼이 여기에 삽입될 예정 -->
                <div id="predict-btn-container" class="text-center"></div>
            </div>
        </div>
    </div>

    <script>
        async function searchNews() {
            const keyword = document.getElementById("keyword").value.trim();
            if (!keyword) {
                alert("검색어를 입력해주세요.");
                return;
            }

            try {
                const response = await fetch("/search", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ keyword })
                });

                const data = await response.json();
                const resultList = document.getElementById("results");
                const predictBtnContainer = document.getElementById("predict-btn-container");

                resultList.innerHTML = "";
                predictBtnContainer.innerHTML = "";  // 이전 버튼 제거

                if (data.results) {
                    data.results.forEach(item => {
                        const li = document.createElement("li");
                        li.textContent = item;
                        li.className = "list-group-item";
                        resultList.appendChild(li);
                    });

                    // 예측하기 버튼 추가
                    const predictBtn = document.createElement("button");
                    predictBtn.textContent = "예측하기";
                    predictBtn.className = "btn btn-success mt-3";
                    predictBtn.onclick = async () => {
                        const titles = Array.from(document.querySelectorAll("#results li")).map(li => li.textContent);

                        try {
                            const response = await fetch("/predict", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({ titles })
                            });

                            const html = await response.text();  // 서버에서 HTML 반환
                            document.open();
                            document.write(html);
                            document.close();
                        } catch (err) {
                            console.error("예측 요청 실패:", err);
                            alert("예측 요청 중 오류 발생!");
                        }
                    };

                    predictBtnContainer.appendChild(predictBtn);

                } else if (data.error) {
                    alert(data.error);
                }
            } catch (err) {
                console.error("에러 발생:", err);
                alert("서버 요청 중 에러 발생!");
            }
        }
    </script>
</body>
</html>
