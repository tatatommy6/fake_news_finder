<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가짜 뉴스 예측</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h1 class="card-title text-center mb-4">가짜 뉴스 예측</h1>

            <form action="/predict" method="post">
                <div class="mb-3">
                    <label for="text" class="form-label">뉴스 본문을 입력하세요:</label>
                    <textarea class="form-control" name="text" id="text" rows="8" required></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">예측하기</button>
                </div>
            </form>

            {% if result %}
            <div class="alert alert-info mt-4" role="alert">
                <h5 class="alert-heading">예측 결과</h5>
                <p class="mb-0"><strong>{{ result }}</strong></p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
