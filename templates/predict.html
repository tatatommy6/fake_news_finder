<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가짜 뉴스 예측 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h1 class="card-title text-center mb-4">가짜 뉴스 예측 결과</h1>

            {% if results %}
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">뉴스 제목</th>
                        <th scope="col">판단</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in results %}
                    <tr>
                        <th scope="row">{{ loop.index }}</th>
                        <td>{{ item.title }}</td>
                        <td>
                            <span class="badge 
                                {% if item.label == 'REAL' %}
                                    bg-success
                                {% else %}
                                    bg-danger
                                {% endif %}
                            ">
                                {{ item.label }} ({{ item.confidence }}%)
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
            {% else %}
            <div class="alert alert-warning" role="alert">
                예측 결과가 없습니다.
            </div>
            {% endif %}

            <div class="text-center mt-4">
                <a href="/" class="btn btn-secondary">← 메인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
