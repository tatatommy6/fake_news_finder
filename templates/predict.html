<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가짜 뉴스 예측 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h1 class="card-title text-center mb-4">가짜 뉴스 예측 결과</h1>

            {% if results %}
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">뉴스 제목</th>
                        <th scope="col">판단</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in results %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ item.title }}</td>
                        <td>
                            <span class="badge 
                                {% if item.label == 'REAL' %}bg-success
                                {% else %}bg-danger
                                {% endif %}
                            ">
                                {{ item.label }} ({{ item.confidence }}%)
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
            {% else %}
            <div class="alert alert-warning" role="alert">
                예측 결과가 없습니다.
            </div>
            {% endif %}

            <div class="text-center mt-4">
                <a href="/" class="btn btn-secondary">← 메인으로 돌아가기</a>
                <button class="btn btn-warning" onclick="sendToRepredict()">재검증하기</button>
            </div>
        </div>
    </div>
</div>
    <script>
        const resultsFromServer = "{{ results | default([]) | tojson | safe }}";

        async function sendToRepredict() {
            if (!resultsFromServer.length || !resultsFromServer[0].link) {
                alert("기사 링크가 없어 재검증을 할 수 없습니다.");
                return;
            }

            try {
                const response = await fetch("/repredict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ articles: resultsFromServer })
                });

                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } catch (err) {
                console.error("재검증 실패:", err);
                alert("재검증 요청 중 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
