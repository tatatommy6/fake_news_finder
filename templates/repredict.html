<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>본문 기반 뉴스 예측 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h1 class="card-title text-center mb-4">본문 기반 뉴스 예측 결과</h1>

            {% if results %}
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>제목</th>
                            <th>언론사</th>
                            <th>판단</th>
                            <th>본문 요약</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in results %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td><a href="{{ item.link }}" target="_blank">{{ item.title }}</a></td>
                            <td>{{ item.source }}</td>
                            <td>
                                <span class="badge {% if item.label == 'REAL' %}bg-success{% else %}bg-danger{% endif %}">
                                    {{ item.label }} ({{ item.confidence }}%)
                                </span>
                            </td>
                            <td>{{ item.text[:150] ~ "..." if item.text }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="alert alert-warning">결과가 없습니다.</div>
            {% endif %}

            <div class="text-center mt-4">
                <a href="/" class="btn btn-secondary">← 메인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
